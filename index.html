<html lang="pt-BR">
<head>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#0f0e0d;--card:#1a1815;--card2:#221f1b;--ink:#ece4d4;--mut:#9a907c;--line:#2e2a24;--acc:#b8904f;--acc-ink:#15120e;--ok:#8fae6b;--warn:#d6a74a;--bad:#c4553b;--r:12px;--serif:"Playfair Display",Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg)}
body{background:repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px),repeating-linear-gradient(-45deg,rgba(0,0,0,.25) 0 2px,transparent 2px 6px),radial-gradient(ellipse at top,#1d1a16 0%,#0f0e0d 60%);background-repeat:no-repeat;background-color:var(--bg);min-height:100vh}
header{position:sticky;top:0;z-index:5;background:rgba(12,11,10,.96);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--acc)}
header h1{margin:0;font:800 20px/1 var(--serif);letter-spacing:4px;text-transform:uppercase;color:var(--acc)}
header small{color:var(--mut);font-size:11px;letter-spacing:.5px}
#snk{position:fixed;left:10px;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:65;display:flex;align-items:center;gap:10px;background:#2a2620;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;box-shadow:0 8px 22px rgba(0,0,0,.6)}#snk span{flex:1}#snk button{background:none;border:0;color:var(--acc);font-weight:800;letter-spacing:.5px;text-transform:uppercase;font-size:13px}
#inst{position:fixed;left:10px;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--acc);border-radius:10px;padding:10px 12px;font-size:14px;box-shadow:0 8px 22px rgba(0,0,0,.6)}#inst span{flex:1}#inst button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:8px 12px;font-weight:700}#inst .x{background:none;color:var(--mut);padding:8px}
header button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:6px 9px;font:inherit;font-size:12px}
main{padding:14px 12px 110px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#0c0b0a;border-top:1px solid var(--acc);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav button.on{color:var(--acc)}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1.2px}
.big{font:800 28px/1.1 var(--serif)}.mid{font:700 19px/1.2 var(--serif)}.mut{color:var(--mut)}.acc{color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px;text-align:center}.st b{display:block;font:800 21px var(--serif)}
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:3px;background:#2a2620;color:var(--mut);font-weight:600;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:#3c4a2e}.pill.warn{color:var(--warn);border-color:#5a4724}.pill.bad{color:var(--bad);border-color:#5a2a20}.pill.pe{color:#c9b892;border-color:#4a4233}
.item{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;font:inherit;color:inherit}
.item b{font-family:var(--serif);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:6px 12px;font:inherit;font-size:12px;white-space:nowrap;color:var(--ink)}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
select,input,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#141210;color:var(--ink);color-scheme:dark}
label{display:block;font-size:11px;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:1px}
.btn{display:block;width:100%;border:1px solid var(--acc);border-radius:8px;padding:14px;font:inherit;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:13px;background:var(--acc);color:var(--acc-ink);margin-top:12px}
.btn.sec{background:transparent;color:var(--acc)}.btn.wa{background:#1f3b2a;border-color:#2f5a3f;color:#cfe9d6}.btn.bad{background:transparent;border-color:#5a2a20;color:var(--bad)}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;margin:0;font-size:12px}
.fab{position:fixed;right:16px;bottom:84px;z-index:7;border:1px solid var(--acc);border-radius:30px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:700;letter-spacing:.8px;text-transform:uppercase;font-size:13px;padding:14px 20px;box-shadow:0 8px 22px rgba(0,0,0,.6)}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:inline-block;flex:none}
.step{display:flex;align-items:center;flex:none}
.step button{width:34px;height:34px;border:1px solid var(--line);border-radius:6px;background:#221f1b;color:var(--ink);font-size:18px}
.step input{width:52px;border:0;background:transparent;text-align:center;padding:4px;font-weight:700}
.lin{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 5px 5px 10px;background:#141210;margin-bottom:6px}
.lin .nm{display:flex;align-items:center;gap:7px;min-width:0}
.x{border:0;background:none;color:var(--bad);font-size:20px;padding:0 6px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);border-top:1px solid var(--acc);width:100%;max-width:640px;margin:0 auto;border-radius:16px 16px 0 0;max-height:93vh;overflow:auto;padding:18px 14px calc(28px + env(safe-area-inset-bottom))}
.sheet h2{margin:2px 0 6px;font:800 22px/1.2 var(--serif)}
.sheet h3{margin:20px 0 8px;font:700 15px var(--serif);color:var(--acc);letter-spacing:1px;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
th{font-size:10.5px;color:var(--mut);text-transform:uppercase;font-weight:600;letter-spacing:1px}
tr.tot td{font-weight:700;color:var(--acc);border-bottom:0}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--acc);color:var(--acc-ink);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;font-weight:600;max-width:90vw}
.load{position:fixed;inset:0;background:rgba(10,9,8,.75);z-index:50;display:flex;align-items:center;justify-content:center;font:700 16px var(--serif);letter-spacing:2px;color:var(--acc);text-align:center;padding:20px}
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:380px;margin:0 auto;text-align:center}
#login h1{font:800 44px/1 var(--serif);letter-spacing:8px;color:var(--acc);margin:0 0 6px}
#login .rule{height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);margin:14px 0 22px}
#login input{font-size:26px;text-align:center;letter-spacing:10px}
.alert{border-left:3px solid var(--warn)}.alert.bad{border-left-color:var(--bad)}
.et{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.et .nm{font-weight:600}.et small{display:block;color:var(--mut);font-size:12px}
.seq{display:flex;flex-wrap:wrap;gap:5px}
.seq span{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#141210;border-radius:6px;padding:3px 7px;font-size:12px}
.seq em{font-style:normal;color:var(--mut);font-size:10px}
.seq .sepf{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.ft{width:100%;max-height:220px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:#000;margin-top:8px;cursor:zoom-in}
.zv{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}.zh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;color:var(--acc);font-weight:700;font-size:14px;border-bottom:1px solid var(--line)}.zh button{background:none;border:1px solid var(--line);color:var(--txt,#eee);border-radius:20px;width:38px;height:38px;font-size:18px}.zs{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;-webkit-overflow-scrolling:touch}.zs img{max-width:100%;max-height:100%;object-fit:contain}.zs:has(img.z){display:block}.zs img.z{max-width:none;max-height:none;width:260%}.zt{text-align:center;color:var(--mut);font-size:12px;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.demo{background:#2a2112;border:1px solid #5a4724;color:var(--warn);font-size:12px;padding:8px 10px;border-radius:8px;margin-bottom:10px}
.fila{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#221f1b;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px;color:var(--warn)}
.fila button{background:var(--acc);border:0;border-radius:6px;padding:6px 10px;font:inherit;font-size:12px;font-weight:700}
.sync{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-left:6px}.sync.on{background:var(--warn)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.tg{border:1px solid var(--line);background:#141210;color:var(--mut);border-radius:6px;padding:7px 10px;font:inherit;font-size:12px;font-weight:700;margin-bottom:12px}
.hb{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:15px;margin-right:6px}
.sw{width:42px;height:24px;border-radius:12px;background:#2a2620;border:1px solid var(--line);position:relative;flex:none;transition:.2s}.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--mut);transition:.2s}.sw.on{background:#3c5a2a;border-color:#4f7a36}.sw.on i{left:20px;background:#e8f3dc}
.pl{display:flex;flex-wrap:wrap;gap:6px}.pl button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 10px;color:var(--ink);font:inherit;font-size:13px}.pl button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}.pl.hrs{display:grid;grid-template-columns:repeat(6,1fr)}.pl.hrs button{padding:7px 0}
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:130px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.45}
.msg.eu{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:4px;font-weight:600}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.bot .ln{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:13.5px}.msg.bot .ln:last-child{border:0}
.msg.bot h4{margin:0 0 6px;font:800 15px var(--serif);color:var(--acc)}
.hb.mas{padding:1px 4px;vertical-align:middle}.hb.mas svg{width:30px;height:30px;display:block}
.mic{border:0;border-radius:22px;background:#221f1b;border:1px solid var(--line);color:var(--acc);width:46px;flex:none;display:flex;align-items:center;justify-content:center}.mic svg{width:20px;height:20px}.mic.on{background:var(--bad);color:#fff;border-color:var(--bad);animation:pul 1s infinite}
@keyframes pul{50%{opacity:.6}}.bav{display:flex;gap:8px;align-items:flex-end}.bav svg{width:30px;height:30px;flex:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}.duo .btn{margin-top:8px}
.cbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:6;background:#0c0b0a;border-top:1px solid var(--line);padding:8px 10px}
.cbar .sg{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.cbar .sg button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:6px 11px;font:inherit;font-size:12.5px}
.cbar form{display:flex;gap:8px;max-width:640px;margin:0 auto}.cbar input{flex:1;border-radius:22px;padding:11px 16px}.cbar form button{border:0;border-radius:22px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:700;padding:0 16px}
</style>
</head>
<body>
<div id="login">
  <h1>SANDEL</h1>
  <p class="mut" style="margin:0;letter-spacing:3px;text-transform:uppercase;font-size:11px">Corte · Mooca</p><div class="rule"></div>
  <p class="mut" style="margin:0 0 10px">Digite seu PIN</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" onkeydown="if(event.key==='Enter')entrar()">
  <button class="btn" onclick="entrar()">Entrar</button>
  <p id="lerr" style="color:var(--bad)"></p>
  <p id="ldemo" class="hint"></p>
</div>
<div id="app" style="display:none">
  <header><div><h1 id="htit">Sandel</h1><small id="sub" onclick="contas()" style="cursor:pointer"></small><span id="sync" class="sync"></span></div><div><button class="hb mas" aria-label="Assistente" onclick="ir('assist')"><i id="masc"></i></button><button class="hb" aria-label="Avisos" onclick="ir('avisos')">🔔</button><button onclick="carregar(true)">↻</button></div></header>
  <main id="main"></main>
  <nav id="nav"></nav>
  <div id="fabw"></div>
</div>
<script>
/* ================= CONFIGURAÇÃO =================
   API = link do Apps Script (Implantar > App da Web). Vazio = modo demonstração (dados só no aparelho). */
const API='https://script.google.com/macros/s/AKfycbyxHiOKRZYJDbcumVw15mSdiRDdMSg2b752QJViz10_kH1_UuosrjnTegTtE0xug4Rl/exec';
const DEMO=!API;
/* ================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const m2=v=>(v===''||v==null)?'':(+v).toFixed(2).replace('.',',');
const n1=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const brl=v=>'R$ '+(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>dstr(new Date());
const dbr=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'';
const dbrY=d=>d?dbr(d)+'/'+d.slice(0,4):'';
const hm=iso=>{if(!iso)return'';const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dhm=iso=>{if(!iso)return'';const d=new Date(iso);return(dstr(d)===hoje()?'':dbr(dstr(d))+' ')+hm(iso)};
const dur=(a,b)=>{const m=Math.round((new Date(b)-new Date(a))/60000);if(!(m>=0))return'';return m<60?m+' min':Math.floor(m/60)+'h'+(m%60?pad(m%60):'')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?0:x};
function store(k,v){try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function getStore(k){try{return localStorage.getItem(k)}catch(e){return null}}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function loading(on,txt){let e=$('#ld');if(on&&!e){e=document.createElement('div');e.id='ld';e.className='load';document.body.appendChild(e)}if(e&&on)e.textContent=txt||'Carregando…';if(!on&&e)e.remove()}

const ETAPAS=[['descanso','Descanso do tecido'],['infesto','Enfesto'],['corte','Corte'],['embalagem','Embalagem'],['contagem','Contagem dos papagaios']];
const TIMED={descanso:1,infesto:1,corte:1};
const ETN=Object.fromEntries(ETAPAS);
const CORES={Preto:'#141414',Marrom:'#6b4226',Branco:'#f4f4f2',Marfim:'#efe6cf',Marinho:'#1f2d5a',Azul:'#2b4c9b',Rubro:'#8e1b1b',Rubi:'#9b1240',Hera:'#2f5d3a',Amarelo:'#e3c13b',Frozen:'#a9d3e6'};
const corHex=c=>CORES[c]||'#777';
const dot=c=>`<i class="dot" style="background:${corHex(c)}"></i>`;

/* ============ REGRAS DE DADOS (iguais no Code.gs) ============ */
function opera(db,a,p){
  if(a==='cfg'){db.config[p.k]=p.v;return}
  const L=db[p.tab];if(!L)throw new Error('Aba desconhecida');
  const id=p.rec?p.rec.id:p.id,i=L.findIndex(x=>x.id===id);
  if(a==='put'){const r=JSON.parse(JSON.stringify(p.rec));if(i>=0){if(p.tab==='cortes')['log','ocorr','pags'].forEach(k=>r[k]=L[i][k]||[]);L[i]=r}else L.push(r);return}
  if(i<0)throw new Error('Registro não encontrado');const R=L[i];
  if(a==='del')L.splice(i,1);
  else if(a==='set')R[p.campo]=p.valor;
  else if(a==='push')R[p.campo]=(R[p.campo]||[]).concat([p.item]);
  else if(a==='upd'){const it=(R[p.campo]||[]).find(x=>x.id===p.iid);if(it)Object.assign(it,p.patch)}
  else if(a==='rm')R[p.campo]=(R[p.campo]||[]).filter(x=>x.id!==p.iid);
  else throw new Error('Ação desconhecida')}
function pode(u,a,p){if(u.papel==='admin')return;
  if(a==='push'&&p.tab==='cortes'&&(p.campo==='log'||p.campo==='ocorr'))return;
  if(a==='set'&&p.tab==='cortes'&&(p.campo==='cores'||p.campo==='packs'))return;
  throw new Error('Sem permissão')}
function visao(db,u){const d=JSON.parse(JSON.stringify(db));d.user=u;
  if(u.papel!=='admin'){d.despesas=[];d.cortes.forEach(c=>{delete c.pags;delete c.preco});d.clientes.forEach(c=>{delete c.preco;delete c.chave});['diaria','socio'].forEach(k=>delete d.config[k])}
  return d}
function portalDe(db,cli){return{cliente:{nome:cli.nome},config:{empresa:db.config.empresa||''},
  cortes:db.cortes.filter(c=>c.cli===cli.id).map(c=>{const x=JSON.parse(JSON.stringify(c));
    x.log=(x.log||[]).map(l=>({e:l.e,t:l.t}));x.ocorr=(x.ocorr||[]).filter(o=>o.aut).map(o=>({id:o.id,desc:o.desc,aut:o.aut,fotos:o.fotos}));
    x.pago=(x.pags||[]).reduce((s,p)=>s+(+p.valor||0),0);delete x.pags;return x})}}

/* ============ CÁLCULO DO CORTE ============ */
function tamsDe(c){return Object.keys(Object.assign({},c.enc||{},c.ret||{})).filter(t=>(+(c.enc||{})[t]||0)+(+(c.ret||{})[t]||0)>0)}
function pk(c){const p=c.packs;return p&&typeof p==='object'?{n:+p.n||0,vol:+p.vol||0}:{n:+p||0,vol:0}}
function volSug(c,n){const e=c.enc||{},r=c.ret||{};let v=0;Object.keys(Object.assign({},e,r)).forEach(t=>{v+=Math.ceil((+e[t]||0)/n)+Math.ceil((+r[t]||0)/n)});return v}
function calc(c){
  const T=tamsDe(c),enc=c.enc||{},ret=c.ret||{};
  const encT=T.reduce((s,t)=>s+(+enc[t]||0),0),retT=T.reduce((s,t)=>s+(+ret[t]||0),0);
  // principal: folhas × encaixes do risco · retalho (risco secundário): folhas de retalho × encaixes do mini risco
  const cores=(c.cores||[]).map(x=>{const f=+x.folhas||0,fr=retT?(+x.fret||0):0,p={};let tot=0;T.forEach(t=>{p[t]=f*(+enc[t]||0)+fr*(+ret[t]||0);tot+=p[t]});return{cor:x.cor,rolos:+x.rolos||0,folhas:f,fret:fr,p,ret:fr*retT,tot}});
  const porT={};T.forEach(t=>porT[t]=cores.reduce((s,x)=>s+x.p[t],0));
  const folhas=cores.reduce((s,x)=>s+x.folhas,0),fret=cores.reduce((s,x)=>s+x.fret,0),rolos=cores.reduce((s,x)=>s+x.rolos,0);
  const total=cores.reduce((s,x)=>s+x.tot,0),retalho=fret*retT;
  const preco=+c.preco||0,valor=Math.round(total*preco*100)/100;
  const pago=c.pago!=null?+c.pago:(c.pags||[]).reduce((s,p)=>s+(+p.valor||0),0);
  // embalagem: cada encaixe = 1 pack (peças = folhas daquele enfesto); sacos com N packs do mesmo tamanho; retalho em sacos próprios
  const PK=pk(c),ps=PK.n,sacos=[];
  const ensaca=(qt,f,rt)=>{if(ps)T.forEach(t=>{let packs=+qt[t]||0;while(packs>0&&f>0){const k=Math.min(ps,packs);sacos.push({tam:t,packs:k,pecas:k*f,folhas:f,ret:rt});packs-=k}})};
  ensaca(enc,folhas,false);if(retT)ensaca(ret,fret,true);
  sacos.forEach((s,i)=>{s.n=i+1});
  return{T,cores,porT,folhas,fret,rolos,total,retalho,encT,retT,preco,valor,pago,saldo:Math.round((valor-pago)*100)/100,sacos}}
// ordem do infesto: nunca repete a mesma cor seguida; se não der, entra 1 folha de outra cor para separar
function seqInfesto(cs){const a=(cs||[]).filter(x=>+x.rolos>0).map(x=>({cor:x.cor,n:+x.rolos,tot:+x.rolos}));
  if(a.length<2)return[];const out=[];let last=null;
  while(a.some(x=>x.n>0)){
    const ok=a.filter(x=>x.n>0&&x.cor!==last).sort((p,q)=>q.n-p.n||q.tot-p.tot);
    if(ok.length){ok[0].n--;last=ok[0].cor;out.push({cor:last})}
    else{const sep=a.filter(x=>x.cor!==last).sort((p,q)=>q.tot-p.tot)[0];out.push({cor:sep.cor,sep:1});last=sep.cor}}
  return out}
function seqHtml(cs){const q=seqInfesto(cs);if(!q.length)return'';let n=0;
  return`<div class="seq">${q.map(x=>x.sep?`<span class="sepf">${dot(x.cor)}1 folha de ${esc(x.cor)}</span>`:`<span><em>${++n}</em>${dot(x.cor)}1 rolo ${esc(x.cor)}</span>`).join('')}</div>${q.some(x=>x.sep)?'<div class="hint">“1 folha” = só uma folha dessa cor para separar, sem gastar o rolo.</div>':''}`}
// estado da etapa pela ORDEM dos lançamentos (não pelo relógio de cada celular)
// "desfazer" (t:'x') cancela o último lançamento da mesma etapa
function logV(c){const o=[];for(const l of (c.log||[])){if(l.t==='x'){for(let j=o.length-1;j>=0;j--)if(o[j].e===l.e){o.splice(j,1);break}}else o.push(l)}return o}
function etSt(c,e){const L=logV(c).filter(x=>x.e===e),u=L[L.length-1],i=L.filter(x=>x.t==='i').pop(),f=L.filter(x=>x.t==='f').pop();
  const ok=!!u&&u.t==='f';return{i,f,ok,on:!!u&&u.t==='i'}}
function proxima(c){for(const[e]of ETAPAS){const s=etSt(c,e);if(!s.ok)return{e,t:s.on?'f':'i'}}return null}
function pendOc(c){return(c.ocorr||[]).filter(o=>!o.aut&&!o.neg)}
function status(c){
  if(c.retirado)return{t:'Retirado',k:'pe'};
  if(pendOc(c).length)return{t:'Aguardando cliente',k:'bad'};
  const p=proxima(c);if(!p)return{t:'Pronto p/ retirar',k:'ok'};
  return p.t==='f'?{t:ETN[p.e],k:'warn'}:{t:'Próx.: '+ETN[p.e],k:''}}

const BUSY={};
async function marca(id,e,t){const c=corteDe(id);if(!c)return;
  const k=id+e;if(BUSY[k]&&Date.now()-BUSY[k]<2000)return;BUSY[k]=Date.now();   // evita toque duplo
  if(e==='embalagem')return fEmb(id);

async function lerRisco(file){if(!file)return;try{FORM._fotoB64=await reduzir(file,1400,.8)}catch(e){return toast('Foto inválida')}reopen(htmlForm());
  try{loading(true,'Lendo o risco…');await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    const big=await reduzir(file,2400,.92);const r=await Tesseract.recognize(big,'por');const o=parseRisco(r.data.text||'');let n=0;
    ['modelo','ref','aprov','comp','larg'].forEach(k=>{if(o[k]!=null&&o[k]!==''){FORM[k]=o[k];n++}});
    if(o.enc&&Object.keys(o.enc).length){FORM.enc=o.enc;FORM._tams=Object.keys(o.enc);n++}
    toast(n?'Li '+n+' campo'+(n>1?'s':'')+' — confira':'Não consegui ler — preencha à mão')}
  catch(e){toast(e.message)}finally{loading(false);reopen(htmlForm())}}
function parseRisco(t){const o={},T=t.replace(/\r/g,'');const f=re=>{const m=T.match(re);return m?num(m[1]):null};
  o.aprov=f(/(?:aproveit|efici)\w*[^\d\n]{0,15}(\d{1,3}(?:[.,]\d+)?)\s*%?/i);
  o.comp=f(/compr\w*[^\d\n]{0,15}(\d{1,3}(?:[.,]\d+)?)/i);
  o.larg=f(/larg\w*[^\d\n]{0,15}(\d(?:[.,]\d+)?)/i);
  if(o.comp>100)o.comp=o.comp/100;if(o.larg>10)o.larg=o.larg/100;
  let m=T.match(/ref\w*\.?\s*(?:do risco)?\s*[:\-]?\s*([A-Za-z0-9\-\/]{1,12})/i);if(m)o.ref=m[1];
  m=T.match(/(?:modelo|produto|nome)\s*[:\-]\s*([^\n]{2,40})/i);if(m)o.modelo=m[1].trim();
  const enc={};let r;const re=/\b(R\d|PP|GG|P|M|G|U)\b\s*[:xX×=\-]\s*(\d{1,2})\b/g;while((r=re.exec(T)))enc[r[1].toUpperCase()]=(enc[r[1].toUpperCase()]||0)+(+r[2]);
  const re2=/\b(\d{1,2})\s*[xX×]?\s*(R\d)\b/g;if(!Object.keys(enc).length)while((r=re2.exec(T)))enc[r[2].toUpperCase()]=(enc[r[2].toUpperCase()]||0)+(+r[1]);
  if(Object.keys(enc).length)o.enc=enc;return o}

/* ============ FILA DE CORTE ============ */
function emAnd(c){return !c.retirado&&!etSt(c,'corte').ok&&(etSt(c,'descanso').on||etSt(c,'descanso').ok||etSt(c,'infesto').on)}
function naFila(c){return !c.retirado&&!emAnd(c)&&!etSt(c,'corte').ok&&!logV(c).some(l=>l.e==='corte')}
function ordFila(L){return L.slice().sort((a,b)=>((a.fila??1e9)-(b.fila??1e9))||(a.data||'').localeCompare(b.data||'')||(a.cod||'').localeCompare(b.cod||''))}
function util(d){return d.getDay()!==0&&(d.getDay()!==6||(D.config||{}).sab!=='0')}
function previsoes(){const cap=Math.max(1,+(D.config||{}).caprol||20),P={};let d=new Date(hoje()+'T12:00');while(!util(d))d.setDate(d.getDate()+1);let usado=0;
  const L=ordFila(D.cortes.filter(emAnd)).concat(ordFila(D.cortes.filter(naFila)));
  L.forEach(c=>{const r=Math.max(1,calc(c).rolos);if(usado>0&&usado+r>cap){do{d.setDate(d.getDate()+1)}while(!util(d));usado=0}P[c.id]=dstr(d);usado+=r});return P}
const DSF=['dom','seg','ter','qua','qui','sex','sáb'];
const dsem=d=>DSF[new Date(d+'T12:00').getDay()]+' '+dbr(d);
function vFilaCorte(){const P=previsoes(),and=ordFila(D.cortes.filter(emAnd)),fila=ordFila(D.cortes.filter(naFila)),adm=ADM(),cap=+(D.config||{}).caprol||20;
  const rol=fila.reduce((s,c)=>s+calc(c).rolos,0);
  let h=`<div class="grid3" style="margin-bottom:10px"><div class="st"><span class="k">Na fila</span><b>${fila.length}</b></div><div class="st"><span class="k">Rolos</span><b>${n0(rol)}</b></div><div class="st"><span class="k">Fila até</span><b style="font-size:16px">${fila.length?dsem(P[fila[fila.length-1].id]):'—'}</b></div></div>
  <div class="hint" style="margin-bottom:10px">Previsão com ${cap} rolos por dia${(D.config||{}).sab==='0'?', sem sábado':''}. ${adm?'Muda em Caixa › Ajustes.':''}</div>`;
  if(and.length)h+=`<div class="k" style="margin:6px 0">Cortando agora</div>`+and.map(c=>itemFila(c,P,0)).join('');
  h+=`<div class="k" style="margin:14px 0 6px">Próximos</div>`+(fila.length?fila.map((c,i)=>itemFila(c,P,i+1,adm,i===0,i===fila.length-1)).join(''):'<div class="empty">Fila vazia</div>');
  return h}
function itemFila(c,P,n,adm,prim,ult){const k=calc(c),cl=cliDe(c.cli),s=status(c);
  return`<div class="item" onclick="detCorte('${c.id}')"><div class="row sp"><div class="row" style="gap:10px;min-width:0">${n?`<b class="mid acc" style="width:26px">${n}º</b>`:''}<div style="min-width:0"><b>${esc(c.cod)} · ${esc(cl.nome)}</b><div class="mut" style="font-size:13px">${esc(c.modelo||'')} · ${n0(k.rolos)} rolos · ${n?'previsão':'termina'} <b style="color:var(--ink)">${P[c.id]?dsem(P[c.id]):'—'}</b></div></div></div>
  ${adm&&n?`<div class="row" style="gap:4px;flex:none"><button class="btn sm sec" style="padding:6px 10px" ${prim?'disabled':''} onclick="event.stopPropagation();moveFila('${c.id}',-1)">▲</button><button class="btn sm sec" style="padding:6px 10px" ${ult?'disabled':''} onclick="event.stopPropagation();moveFila('${c.id}',1)">▼</button></div>`:`<span class="pill ${s.k}">${esc(s.t)}</span>`}</div></div>`}
function moveFila(id,dir){const L=ordFila(D.cortes.filter(naFila)),i=L.findIndex(c=>c.id===id),j=i+dir;if(i<0||j<0||j>=L.length)return;

const b64bin=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const pushOk=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
function pushAtivo(){return pushOk()&&Notification.permission==='granted'&&getStore('cor_push')==='1'}
async function cfgSW(){try{const c=await caches.open('cor-cfg');await c.put('cfg',new Response(JSON.stringify({api:API,pin:PIN})))}catch(e){}}
async function minhaInsc(){const reg=await navigator.serviceWorker.ready;return reg.pushManager.getSubscription()}
async function ativarAvisos(){
  if(!pushOk())return toast(/iphone|ipad/i.test(navigator.userAgent)?'No iPhone, abra o app pelo ícone da tela inicial':'Este navegador não aceita avisos');
  try{const p=await Notification.requestPermission();if(p!=='granted')return toast('Avisos bloqueados. Libere nas configurações do celular.');
    loading(true);const k=await call('pushKey',{},true);const reg=await navigator.serviceWorker.ready;
    let s=await reg.pushManager.getSubscription();if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64bin(k.key)});
    await call('pushSub',{sub:s.toJSON()},true);await cfgSW();store('cor_push','1');AVC=null;toast('Avisos ligados');render()}
  catch(e){toast('Erro: '+e.message)}finally{loading(false)}}
async function desativarAvisos(){try{const s=await minhaInsc();if(s){await call('pushDel',{endpoint:s.endpoint},true);await s.unsubscribe()}}catch(e){}store('cor_push');toast('Avisos desligados');render()}
async function testarAviso(){try{const s=await minhaInsc();if(!s)return toast('Ligue os avisos de novo');loading(true);await call('avisoTeste',{endpoint:s.endpoint},true);toast('Aviso enviado — confira as notificações')}catch(e){toast('Erro: '+e.message)}finally{loading(false)}}
const AVT=[['ocorr','⚠️','Esperando o cliente','Cortes com ocorrência para o cliente autorizar',0],['producao','✂️','Em produção','Cortes andando e a próxima etapa de cada um',0],['prontos','✅','Prontos para retirar','Cortes terminados esperando o cliente buscar',0],['receber','💵','A receber','Quanto cada cliente deve dos cortes',1]];
const DSEM=['D','S','T','Q','Q','S','S'];
let AVC=null,AVSUJO=false;
async function avCarregar(){try{const s=await minhaInsc();if(!s)return;const r=await call('pushCfgGet',{endpoint:s.endpoint},true);if(r.cfg&&!AVSUJO){AVC=r.cfg;store('cor_avc',JSON.stringify(AVC));render()}}catch(e){}}
function avTog(t){const c=AVC[t]=AVC[t]||{on:false,h:[9],d:[1,2,3,4,5,6]};c.on=!c.on;AVSUJO=true;render()}
function avHora(t,h){const c=AVC[t],i=c.h.indexOf(h);if(i>=0)c.h.splice(i,1);else{if(c.h.length>=6)return toast('No máximo 6 horários por aviso');c.h.push(h)}c.h.sort((a,b)=>a-b);AVSUJO=true;render()}
function avDia(t,d){const c=AVC[t];c.d=c.d||[0,1,2,3,4,5,6];const i=c.d.indexOf(d);if(i>=0){if(c.d.length===1)return;c.d.splice(i,1)}else c.d.push(d);AVSUJO=true;render()}
async function avSalvar(){try{const s=await minhaInsc();if(!s)return toast('Ligue os avisos de novo');loading(true);await call('pushCfgSet',{endpoint:s.endpoint,cfg:AVC},true);store('cor_avc',JSON.stringify(AVC));AVSUJO=false;toast('Avisos salvos');render()}catch(e){toast('Erro: '+e.message)}finally{loading(false)}}
function vAvisos(){
  const vol=`<button class="tg" onclick="ir('hoje')">‹ Voltar</button>`;
  if(!pushAtivo())return vol+`<div class="card"><div class="k">Avisos no celular</div><div class="mid" style="margin:6px 0">🔕 Desligados</div><p class="mut" style="margin:0;font-size:13.5px">Receba no horário que quiser: ocorrências, cortes em produção e prontos para retirar${ADM()?' e quanto os clientes devem':''}.</p><button class="btn" onclick="ativarAvisos()">Ligar avisos</button></div>`;
  if(!AVC){try{AVC=JSON.parse(getStore('cor_avc')||'null')}catch(e){}if(!AVC)AVC={};avCarregar()}
  let h=vol+`<p class="mut" style="margin:0 4px 10px;font-size:13px">Ligue os avisos que quer receber, escolha os horários e os dias. Cada celular tem a sua escolha.</p>`;
  AVT.filter(a=>!a[4]||ADM()).forEach(([t,ic,nome,desc])=>{const c=AVC[t]||{on:false,h:[],d:[1,2,3,4,5,6]},dias=c.d&&c.d.length?c.d:[0,1,2,3,4,5,6];
    h+=`<div class="card"><div class="row sp" onclick="avTog('${t}')" style="cursor:pointer"><span><b style="font-size:15px">${ic} ${nome}</b><div class="mut" style="font-size:12px">${desc}</div></span><span class="sw${c.on?' on':''}"><i></i></span></div>`;
    if(c.on)h+=`<div class="k" style="margin:12px 0 6px">Horários</div><div class="pl hrs">${Array.from({length:17},(_,i)=>i+6).map(x=>`<button class="${c.h.includes(x)?'on':''}" onclick="avHora('${t}',${x})">${x}h</button>`).join('')}</div>
      <div class="k" style="margin:12px 0 6px">Dias</div><div class="pl">${DSEM.map((l,i)=>`<button class="${dias.includes(i)?'on':''}" style="min-width:36px" onclick="avDia('${t}',${i})">${l}</button>`).join('')}</div>${c.h.length?'':'<div style="color:var(--warn);font-size:12px;margin-top:6px">Escolha pelo menos um horário</div>'}`;
    h+='</div>'});
  h+=`<button class="btn" onclick="avSalvar()">${AVSUJO?'Salvar mudanças':'Salvo ✓'}</button><button class="btn sec" onclick="testarAviso()">Mandar um aviso agora</button><button class="btn sec" style="color:var(--mut);border-color:var(--line)" onclick="desativarAvisos()">Desligar todos os avisos</button>`;
  return h}


/* ---------- ASSISTENTE (responde na hora, com os dados do app) ---------- */
let CH=null;
const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function chLoad(){if(CH)return;try{CH=JSON.parse(getStore('cor_chat_'+PIN)||'[]')}catch(e){CH=[]}}
function chSave(){store('cor_chat_'+PIN,JSON.stringify(CH.slice(-40)))}
function sugestoes(){return ['Em produção','Prontos para retirar','Esperando o cliente','Peças hoje'].concat(ADM()?['Quem me deve?','Caixa do mês']:[]).concat(['Limpar conversa'])}
function vAssist(){chLoad();
  let h=`<button class="tg" onclick="ir('hoje')">‹ Voltar</button><div class="chat">`;
  if(!CH.length)h+=`<div class="bav">${mascote()}<div class="msg bot"><h4>Sandel, seu assistente do corte</h4>Pergunte do seu jeito. Exemplos:<br>• <b>o que está em produção</b><br>• <b>prontos para retirar</b><br>• <b>peças hoje</b> ou <b>peças da semana</b><br>• o nome de um cliente ou o código de um corte${ADM()?'<br>• <b>quem me deve</b> · <b>caixa do mês</b>':''}<br><br>Toque no microfone 🎤 para falar.</div></div>`;
  h+=CH.map(m=>m.eu?`<div class="msg eu">${esc(m.t)}</div>`:`<div class="bav">${mascote()}<div class="msg bot">${m.h}</div></div>`).join('')+'</div>';
  h+=`<div class="cbar"><div class="sg">${sugestoes().map(t=>`<button onclick="pergAssist('${t}')">${t}</button>`).join('')}</div><form onsubmit="event.preventDefault();const i=$('#cq');const v=i.value;i.value='';pergAssist(v)"><button type="button" class="mic${OUVINDO?' on':''}" onclick="falar()" aria-label="Falar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><input id="cq" placeholder="Pergunte ou toque no 🎤" autocomplete="off" enterkeyhint="send"><button>Enviar</button></form></div>`;
  return h}
let OUVINDO=false,REC=null,VOZ=false;
function falar(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return toast('Este celular não tem reconhecimento de voz no app. Use o teclado (o microfone do teclado também funciona).');
  if(OUVINDO&&REC){REC.stop();return}
  REC=new SR();REC.lang='pt-BR';REC.interimResults=false;REC.maxAlternatives=1;
  REC.onresult=e=>{const t=e.results[0][0].transcript;VOZ=true;pergAssist(t)};
  REC.onerror=e=>{OUVINDO=false;render();if(e.error==='not-allowed')toast('Libere o microfone para o app nas configurações do celular');else if(e.error!=='no-speech'&&e.error!=='aborted')toast('Não ouvi bem, tente de novo')};
  REC.onend=()=>{OUVINDO=false;render()};
  try{REC.start();OUVINDO=true;render()}catch(e){toast('Microfone ocupado, tente de novo')}}
function diz(h){try{if(!('speechSynthesis' in window))return;const d=document.createElement('div');d.innerHTML=h.replace(/<\/(div|h4|br)>|<br>/g,'. ');
  const u=new SpeechSynthesisUtterance(d.textContent.replace(/R\$/g,'reais').replace(/\s+/g,' ').trim());u.lang='pt-BR';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
let IA_OFF=false,PENS=false;
function ctxIA(){const adm=ADM(),P=previsoes(),now=new Date().toISOString();
  const et=c=>Object.fromEntries(ETAPAS.map(([e,n])=>{const st=etSt(c,e);return[n,st.ok?(TIMED[e]&&st.i?'feito em '+dur(st.i.em,st.f.em)+' ('+dbr(st.i.em.slice(0,10))+' '+hm(st.i.em)+'-'+hm(st.f.em)+', '+(st.i.por||'')+')':'feito '+dbr((st.f.em||'').slice(0,10))):st.on?'em andamento desde '+dbr(st.i.em.slice(0,10))+' '+hm(st.i.em)+' ('+dur(st.i.em,now)+')':'não iniciado']}));
  const cs=ordena(D.cortes).slice(0,80).map(c=>{const k=calc(c),o={codigo:c.cod,cliente:cliDe(c.cli).nome,data:c.data,modelo:c.modelo,risco:c.ref,situacao:status(c).t,retirado:c.retirado||'',
    rolos_por_cor:Object.fromEntries(k.cores.map(x=>[x.cor,x.rolos])),folhas_por_cor:Object.fromEntries(k.cores.map(x=>[x.cor,x.folhas])),pecas_total:k.total,pecas_por_tamanho:k.porT,
    pecas_por_cor:Object.fromEntries(k.cores.map(x=>[x.cor,x.tot])),etapas:et(c),ocorrencias_pendentes:pendOc(c).length,packs_por_saco:pk(c).n||'',volumes:pk(c).vol||'',
    fila:naFila(c)?'na fila':emAnd(c)?'cortando':'',previsao:P[c.id]||''};
    if(adm)Object.assign(o,{preco_peca:k.preco,valor:k.valor,pago:k.pago,saldo:k.saldo});return o});
  const x={hoje:hoje(),usuario:D.user,capacidade_rolos_dia:+(D.config||{}).caprol||20,ordem_da_fila:ordFila(D.cortes.filter(naFila)).map(c=>c.cod),cortes:cs,clientes:(D.clientes||[]).map(c=>c.nome)};
  if(adm)x.despesas=(D.despesas||[]).slice(-120).map(d=>({data:d.data,tipo:d.tipo,desc:d.desc,valor:d.valor}));
  return JSON.stringify(x)}
function fmtIA(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
async function pergAssist(t){t=String(t||'').trim();if(!t||PENS)return;chLoad();
  if(/^limpar( conversa)?$/i.test(t)){CH=[];chSave();render();return}
  CH.push({eu:1,t});let r=null,txt='';
  if(!IA_OFF&&!DEMO&&navigator.onLine){PENS=true;CH.push({h:'<span class="mut">pensando…</span>',tmp:1});render();requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight));
    try{const hist=[];CH.filter(m=>!m.tmp).slice(-7,-1).forEach(m=>hist.push(m.eu?{role:'user',content:m.t}:{role:'assistant',content:m.txt||String(m.h).replace(/<[^>]+>/g,' ')}));
      const q=await call('ia',{q:t,ctx:ctxIA(),hist},true);if(q.semIA)IA_OFF=true;else if(q.r){txt=q.r;r=fmtIA(q.r)}}catch(e){r=null}
    CH=CH.filter(m=>!m.tmp);PENS=false}
  if(!r){try{r=responde(t)}catch(e){r='Não consegui montar a resposta ('+esc(e.message)+').'}}
  CH.push({h:r,txt});chSave();render();if(VOZ){VOZ=false;diz(r)}requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight))}
const lnA=(a,b)=>`<div class="ln"><span>${a}</span><span style="text-align:right;white-space:nowrap">${b||''}</span></div>`;
function responde(t){
  const q=nrm(t),adm=ADM(),C=D.cortes||[],at=ordena(C.filter(c=>!c.retirado)).reverse();
  const nm=c=>esc(cliDe(c.cli).nome),lin=c=>lnA(`<b>${esc(c.cod)}</b> ${nm(c)} <span class="mut">${esc(c.modelo||'')}</span>`,`<span class="mut">${esc(status(c).t)}</span>`);
  const cl=(D.clientes||[]).find(c=>{const n=nrm(c.nome);return n.length>2&&new RegExp('\\b'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(q)});
  const co=C.find(c=>c.cod&&new RegExp('\\b'+nrm(c.cod).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(q));
  const ini=d=>{const x=new Date();x.setDate(x.getDate()-d);return dstr(x)};
  if(/^(oi|ola|opa|bom dia|boa tarde|boa noite)\b/.test(q)&&q.length<18)return 'Olá! O que você quer saber? Use os botões aí embaixo ou escreva do seu jeito.';
  if(co){const k=calc(co);let h=`<h4>Corte ${esc(co.cod)}</h4>`+lnA('Cliente',nm(co))+lnA('Modelo',esc(co.modelo||'—'))+lnA('Data',dbr(co.data))+lnA('Peças',n0(k.total))+lnA('Situação',`<b>${esc(status(co).t)}</b>`);
    if(pendOc(co).length)h+=lnA('Ocorrências',pendOc(co).length+' esperando o cliente');
    if(adm&&k.valor>0)h+=lnA('Valor',brl(k.valor))+lnA('Falta receber',`<b>${brl(Math.max(0,k.saldo))}</b>`);return h}
  if(adm&&/deve|receber|devendo|cobrar|saldo/.test(q)){
    const por={};C.forEach(c=>{if(cl&&c.cli!==cl.id)return;const k=calc(c);if(k.valor>0&&k.saldo>0.01){const n=cliDe(c.cli).nome;por[n]=(por[n]||0)+k.saldo}});
    const L=Object.entries(por).sort((a,b)=>b[1]-a[1]),tot=L.reduce((s,x)=>s+x[1],0);
    if(!L.length)return (cl?esc(cl.nome)+' não deve nada':'Ninguém deve nada agora')+'. ✅';
    return `<h4>${cl?esc(cl.nome)+' deve':'A receber'} ${brl(tot)}</h4>`+(cl?C.filter(c=>c.cli===cl.id&&calc(c).saldo>0.01&&calc(c).valor>0).map(c=>lnA(`<b>${esc(c.cod)}</b> <span class="mut">${dbr(c.data)}</span>`,`<b>${brl(calc(c).saldo)}</b>`)).join(''):L.map(([n,v])=>lnA(esc(n),`<b>${brl(v)}</b>`)).join(''))}
  if(adm&&/caixa|recebi|despesa|lucro|resultado/.test(q)){const m=hoje().slice(0,7),inM=d=>d&&d.slice(0,7)===m;
    let rec=0;C.forEach(c=>(c.pags||[]).forEach(p=>{if(inM(p.data))rec+=+p.valor||0}));const dsp=(D.despesas||[]).filter(x=>inM(x.data)).reduce((s,x)=>s+(+x.valor||0),0);
    return `<h4>Caixa do mês</h4>`+lnA('Recebido',brl(rec))+lnA('Despesas',brl(dsp))+lnA('Resultado',`<b>${brl(rec-dsp)}</b>`)}
  if(/ocorr|esperando|autoriz|aguard/.test(q)){const L=at.filter(c=>pendOc(c).length);return L.length?`<h4>${L.length} esperando o cliente</h4>`+L.map(lin).join(''):'Nenhum corte esperando o cliente. ✅'}
  if(/pront|retir|busca/.test(q)){const L=at.filter(c=>!pendOc(c).length&&!proxima(c));return L.length?`<h4>${L.length} pronto${L.length>1?'s':''} para retirar</h4>`+L.map(lin).join(''):'Nenhum corte pronto esperando retirada.'}
  if(/pec|cortad|hoje|semana|mes/.test(q)&&!cl){const p=/semana/.test(q)?['Últimos 7 dias',ini(6)]:/mes/.test(q)?['Este mês',hoje().slice(0,7)+'-01']:['Hoje',hoje()];
    const L=C.filter(c=>(c.data||'')>=p[1]),tot=L.reduce((s,c)=>s+calc(c).total,0);
    return `<h4>${p[0]}: ${n0(tot)} peças</h4>`+(L.length?L.map(c=>lnA(`<b>${esc(c.cod)}</b> ${nm(c)}`,n0(calc(c).total)+' pç')).join(''):'<span class="mut">Nenhum corte lançado.</span>')}
  if(cl){const L=C.filter(c=>c.cli===cl.id),A=L.filter(c=>!c.retirado);let h=`<h4>${esc(cl.nome)}</h4>`+lnA('Cortes ativos',n0(A.length))+lnA('Peças nos ativos',n0(A.reduce((s,c)=>s+calc(c).total,0)));
    if(adm){const sd=L.reduce((s,c)=>{const k=calc(c);return s+(k.valor>0?Math.max(0,k.saldo):0)},0);h+=lnA('Deve hoje',`<b>${brl(sd)}</b>`)}
    return h+(A.length?'<div style="margin-top:6px"></div>'+ordena(A).map(lin).join(''):'')}
  if(/produc|andamento|cortes|corte|etapa|fila/.test(q)){const L=at.filter(c=>!pendOc(c).length&&proxima(c));return L.length?`<h4>${L.length} em produção</h4>`+L.map(lin).join(''):'Nenhum corte em produção agora.'}
  return 'Não entendi essa. Tente <b>em produção</b>, <b>prontos para retirar</b>, <b>peças hoje</b>, o nome de um cliente ou o código de um corte'+(adm?', ou <b>quem me deve</b>':'')+'.';
}

<script>
// diálogos próprios (o confirm/prompt do celular pode ser bloqueado no app instalado)
function pergunta(msg,sim,perigo){return new Promise(res=>{const el=document.getElementById('cfm'),e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  el.innerHTML=`<div class="sheet" id="cfmb"><div><h2>Confirmar</h2><p style="font-size:15px;margin:4px 0 0">${e(msg)}</p><button class="btn${perigo?' bad':''}" id="cfok">${e(sim||'Confirmar')}</button><button class="btn sec" id="cfno">Cancelar</button></div></div>`;
  const fim=v=>{el.innerHTML='';res(v)};document.getElementById('cfok').onclick=()=>fim(true);document.getElementById('cfno').onclick=()=>fim(false);document.getElementById('cfmb').onclick=ev=>{if(ev.target.id==='cfmb')fim(false)}})}
function pedeValor(msg,ini){return new Promise(res=>{const el=document.getElementById('cfm'),e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  el.innerHTML=`<div class="sheet" id="cfmb"><div><h2>Informe</h2><p style="font-size:14px;margin:4px 0 10px">${e(msg)}</p><input id="cfv" value="${e(ini)}"><button class="btn" id="cfok">OK</button><button class="btn sec" id="cfno">Cancelar</button></div></div>`;
  const v=()=>document.getElementById('cfv').value,fim=x=>{el.innerHTML='';res(x)};document.getElementById('cfok').onclick=()=>fim(v());document.getElementById('cfno').onclick=()=>fim(null);document.getElementById('cfv').onkeydown=ev=>{if(ev.key==='Enter')fim(v())};setTimeout(()=>{const i=document.getElementById('cfv');if(i){i.focus();i.select()}},60)})}
if('serviceWorker' in navigator){const tinha=!!navigator.serviceWorker.controller;let rec=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!tinha||rec)return;rec=true;const m=document.getElementById('modal');if(!(m&&m.innerHTML)&&!document.getElementById('cfm').innerHTML)location.reload()})}
</script>
</body>
</html>
